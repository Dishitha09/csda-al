[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csda-al"
version = "0.1.0"
description = "Cold-start and difficulty-aware active learning research architecture"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.6.0", "torchvision==0.21.0", "numpy==1.26.4", "pandas==2.2.3",
  "scikit-learn==1.6.1", "scipy==1.15.2", "Pillow==11.1.0", "PyYAML==6.0.2",
  "tqdm==4.67.1", "matplotlib==3.10.1"
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.2", "mypy==1.15.0"]

[project.scripts]
csda-al = "csda_al.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = ["torch", "torch.*", "torchvision", "torchvision.*", "numpy", "numpy.*", "scipy", "scipy.*", "sklearn", "sklearn.*", "matplotlib", "matplotlib.*", "PIL", "PIL.*", "pandas", "pandas.*"]
follow_imports = "skip"
